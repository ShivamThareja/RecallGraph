[project]
name = "weavy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.6.0",
    "langfuse>=4.0.6",
    "litellm>=1.82.1",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
weavy = "weavy.cli:main"

[project.optional-dependencies]
langfuse = [
    "langfuse>=2.0.0",
]
dev = [
    "ruff",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires live FalkorDB and API keys"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]
